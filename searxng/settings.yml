use_default_settings: true

general:
  instance_name: "拓界搜索 SearXNG"

search:
  safe_search: 1
  formats:
    - html
    - json

outgoing:
  # Several useful metasearch adapters need slightly more than SearXNG's
  # three-second default. The Beyond Search API still enforces its own bounded
  # total timeout, so one unhealthy source cannot hang the page indefinitely.
  request_timeout: 8.0

server:
  bind_address: "0.0.0.0"
  port: 8080
  # 仅用于本机开发；正式部署时必须替换为随机长字符串。
  secret_key: "beyond-search-local-development-only-change-me"
  limiter: false
  image_proxy: true
